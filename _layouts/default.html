<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <style>
      body {
        margin: 0;
        color: #1f2933;
        background: #ffffff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
      }

      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 2rem 1.25rem 4rem;
      }

      img {
        max-width: 100%;
        height: auto;
      }

      table {
        border-collapse: collapse;
        width: 100%;
      }

      th,
      td {
        border: 1px solid #d0d7de;
        padding: 0.5rem 0.65rem;
        vertical-align: top;
      }

      th {
        background: #f6f8fa;
        text-align: left;
      }

      th:first-child,
      td:first-child {
        min-width: 5.5rem;
        white-space: nowrap;
      }

      a {
        color: #0969da;
      }
    </style>
  </head>
  <body>
    <main>
      {{ content }}
    </main>
  </body>
</html>
